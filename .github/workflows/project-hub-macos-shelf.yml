name: Project Hub macOS Shelf build

on:
  pull_request:
    paths:
      - 'project-hub-mac/**'
      - '.github/workflows/project-hub-macos-shelf.yml'
  workflow_dispatch:

jobs:
  swift-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Compile macOS Shelf
        working-directory: project-hub-mac
        run: swift build -c debug
      - name: Package preview app
        working-directory: project-hub-mac
        run: bash scripts/package-app.sh
      - name: Upload Mac preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ProjectHubShelf-macOS-arm64-preview
          path: project-hub-mac/dist/ProjectHubShelf-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
