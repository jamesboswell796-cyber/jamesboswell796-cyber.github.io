name: AQA corpus fetch test

on:
  push:
    branches: [aqa-corpus-fetch-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Build complete MM2B corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          try_one() {
            local url="$1" dest="$2" tmp="${2}.part"
            rm -f "$tmp"
            if curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 20 "$url" -o "$tmp" \
              && [ "$(head -c 4 "$tmp" 2>/dev/null || true)" = '%PDF' ]; then
              mv "$tmp" "$dest"
              return 0
            fi
            rm -f "$tmp"
            return 1
          }
          fetch_pdf() {
            local year="$1" season="$2" kind="$3"
            local yy="${year:2:2}" code season_full dest pmt_base colman_base ttc_base
            if [ "$season" = Jan ]; then season_full=January; code=JAN; else season_full=June; code=JUN; fi
            dest="out/AQA-MM2B-${kind}-${code}${yy}.pdf"
            pmt_base="https://pmt.physicsandmathstutor.com/download/Maths/A-level/M2/Papers-AQA/${season_full}%20${year}%20${kind}%20-%20M2%20AQA"
            colman_base="https://www.colmanweb.co.uk/pastpapers/Papers/A%20Level/AQA%206360/AQA-6360-MM2B"
            ttc_base="https://www.thetuitioncentre.uk/revision/files/Past%20Papers/A-Level/Maths/AQA"
            try_one "${pmt_base}.pdf" "$dest" && return 0
            try_one "${pmt_base}.PDF" "$dest" && return 0
            if [ "$kind" = QP ]; then
              try_one "${colman_base}/AQA-MM2B-QP-${code}${yy}.PDF" "$dest" && return 0
              try_one "${ttc_base}/AQA-MM2B-QP-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/app/uploads/2020/01/AQA-MM2B-QP-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/wp-content/uploads/2020/01/AQA-MM2B-QP-${code}${yy}.pdf" "$dest" && return 0
            else
              try_one "${colman_base}/AQA-MM2B-W-MS-${code}${yy}.PDF" "$dest" && return 0
              try_one "${colman_base}/AQA-MM2B-MS-${code}${yy}.PDF" "$dest" && return 0
              try_one "${ttc_base}/AQA-MM2B-W-MS-${code}${yy}.pdf" "$dest" && return 0
              try_one "${ttc_base}/AQA-MM2B-MS-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/app/uploads/2020/01/AQA-MM2B-W-MS-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/wp-content/uploads/2020/01/AQA-MM2B-W-MS-${code}${yy}.pdf" "$dest" && return 0
            fi
            echo "FAILED $year $season $kind" >&2
            exit 1
          }

          curl -fL --retry 3 --retry-delay 2 \
            'https://colmanweb.co.uk/pastpapers/Papers/A%20Level/AQA%206360/2005%20June/Mechanics%202B%20Jun%202005%20QP.PDF' \
            -o 'out/AQA-MM2B-QP-JUN05.pdf'
          curl -fL --retry 3 --retry-delay 2 \
            'https://colmanweb.co.uk/pastpapers/Papers/A%20Level/AQA%206360/2005%20June/Mechanics%202B%20Jun%202005%20MS.PDF' \
            -o 'out/AQA-MM2B-MS-JUN05.pdf'
          test "$(head -c 4 out/AQA-MM2B-QP-JUN05.pdf)" = '%PDF'
          test "$(head -c 4 out/AQA-MM2B-MS-JUN05.pdf)" = '%PDF'

          for year in 2006 2007 2008 2009 2010 2011 2012 2013; do
            for season in Jan Jun; do
              for kind in QP MS; do fetch_pdf "$year" "$season" "$kind"; done
            done
          done
          for year in 2014 2015 2016 2017 2018; do
            for kind in QP MS; do fetch_pdf "$year" Jun "$kind"; done
          done

          test "$(find out -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 44
          for f in out/*.pdf; do test "$(head -c 4 "$f")" = '%PDF'; done
          sha256sum out/*.pdf > out/SHA256SUMS.txt
      - name: Upload complete MM2B artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqa-mm2b-corpus-complete
          path: out
          if-no-files-found: error
          retention-days: 1
