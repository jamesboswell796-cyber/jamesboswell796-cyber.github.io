name: AQA corpus fetch test

on:
  push:
    branches: [aqa-corpus-fetch-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Repair MM2B June 2005 pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2 \
            'https://colmanweb.co.uk/pastpapers/Papers/A%20Level/AQA%206360/2005%20June/Mechanics%202B%20Jun%202005%20QP.PDF' \
            -o 'out/AQA-MM2B-QP-JUN05.pdf'
          curl -fL --retry 3 --retry-delay 2 \
            'https://colmanweb.co.uk/pastpapers/Papers/A%20Level/AQA%206360/2005%20June/Mechanics%202B%20Jun%202005%20MS.PDF' \
            -o 'out/AQA-MM2B-MS-JUN05.pdf'
          test "$(head -c 4 out/AQA-MM2B-QP-JUN05.pdf)" = '%PDF'
          test "$(head -c 4 out/AQA-MM2B-MS-JUN05.pdf)" = '%PDF'
          sha256sum out/*.pdf > out/SHA256SUMS.txt
      - name: Upload repair artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqa-mm2b-jun05-repair
          path: out
          if-no-files-found: error
          retention-days: 1
