name: AQA corpus fetch test

on:
  push:
    branches: [aqa-corpus-fetch-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download remaining AQA 6360 units
        shell: bash
        run: |
          set -u -o pipefail
          units='MPC3 C3 MPC4 C4 MM1B M1 MM2B M2 MS1B S1 MS2B S2'
          mkdir -p out/{MPC3,MPC4,MM1B,MM2B,MS1B,MS2B}
          : > out/FAILURES.txt

          try_one() {
            local url="$1" dest="$2" tmp="${2}.part"
            rm -f "$tmp"
            if curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 20 "$url" -o "$tmp" \
              && [ "$(head -c 4 "$tmp" 2>/dev/null || true)" = '%PDF' ]; then
              mv "$tmp" "$dest"
              echo "OK $dest <- $url"
              return 0
            fi
            rm -f "$tmp"
            return 1
          }

          fetch_pdf() {
            local unit="$1" alias="$2" year="$3" season="$4" kind="$5"
            local yy="${year:2:2}" code season_full dest pmt_base colman_base ttc_base mme_kind
            if [ "$season" = Jan ]; then season_full=January; code=JAN; else season_full=June; code=JUN; fi
            dest="out/${unit}/AQA-${unit}-${kind}-${code}${yy}.pdf"
            pmt_base="https://pmt.physicsandmathstutor.com/download/Maths/A-level/${alias}/Papers-AQA/${season_full}%20${year}%20${kind}%20-%20${alias}%20AQA"
            colman_base="https://www.colmanweb.co.uk/pastpapers/Papers/A%20Level/AQA%206360/AQA-6360-${unit}"
            ttc_base="https://www.thetuitioncentre.uk/revision/files/Past%20Papers/A-Level/Maths/AQA"

            try_one "${pmt_base}.pdf" "$dest" && return 0
            try_one "${pmt_base}.PDF" "$dest" && return 0
            if [ "$kind" = QP ]; then
              try_one "${colman_base}/AQA-${unit}-QP-${code}${yy}.PDF" "$dest" && return 0
              try_one "${ttc_base}/AQA-${unit}-QP-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/app/uploads/2020/01/AQA-${unit}-QP-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/wp-content/uploads/2020/01/AQA-${unit}-QP-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/app/uploads/2020/01/AQA-${unit}-P-QP-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/wp-content/uploads/2020/01/AQA-${unit}-P-QP-${code}${yy}.pdf" "$dest" && return 0
            else
              try_one "${colman_base}/AQA-${unit}-W-MS-${code}${yy}.PDF" "$dest" && return 0
              try_one "${colman_base}/AQA-${unit}-MS-${code}${yy}.PDF" "$dest" && return 0
              try_one "${ttc_base}/AQA-${unit}-W-MS-${code}${yy}.pdf" "$dest" && return 0
              try_one "${ttc_base}/AQA-${unit}-MS-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/app/uploads/2020/01/AQA-${unit}-W-MS-${code}${yy}.pdf" "$dest" && return 0
              try_one "https://mmerevise.co.uk/wp-content/uploads/2020/01/AQA-${unit}-W-MS-${code}${yy}.pdf" "$dest" && return 0
            fi
            echo "FAIL ${unit} ${season} ${year} ${kind}" | tee -a out/FAILURES.txt
            return 0
          }

          for spec in 'MPC3 C3' 'MPC4 C4' 'MM1B M1' 'MM2B M2' 'MS1B S1' 'MS2B S2'; do
            set -- $spec; unit="$1"; alias="$2"
            if [ "$unit" = MM1B ] || [ "$unit" = MS1B ]; then
              for kind in QP MS; do fetch_pdf "$unit" "$alias" 2005 Jan "$kind"; done
            fi
            for kind in QP MS; do fetch_pdf "$unit" "$alias" 2005 Jun "$kind"; done
            for year in 2006 2007 2008 2009 2010 2011 2012 2013; do
              for season in Jan Jun; do
                for kind in QP MS; do fetch_pdf "$unit" "$alias" "$year" "$season" "$kind"; done
              done
            done
            for year in 2014 2015 2016 2017 2018; do
              for kind in QP MS; do fetch_pdf "$unit" "$alias" "$year" Jun "$kind"; done
            done
            sha256sum out/${unit}/*.pdf > out/${unit}/SHA256SUMS.txt 2>/dev/null || true
          done

          : > out/COUNTS.txt
          for unit in MPC3 MPC4 MM1B MM2B MS1B MS2B; do
            echo "${unit}_PDF_COUNT=$(find out/${unit} -maxdepth 1 -type f -name '*.pdf' | wc -l)" | tee -a out/COUNTS.txt
          done
          echo "FAILURE_COUNT=$(wc -l < out/FAILURES.txt)" | tee -a out/COUNTS.txt

      - name: Upload MPC3 artifact
        uses: actions/upload-artifact@v4
        with: {name: aqa-mpc3-corpus, path: "out/MPC3\nout/FAILURES.txt\nout/COUNTS.txt", retention-days: 1}
      - name: Upload MPC4 artifact
        uses: actions/upload-artifact@v4
        with: {name: aqa-mpc4-corpus, path: "out/MPC4\nout/FAILURES.txt\nout/COUNTS.txt", retention-days: 1}
      - name: Upload MM1B artifact
        uses: actions/upload-artifact@v4
        with: {name: aqa-mm1b-corpus, path: "out/MM1B\nout/FAILURES.txt\nout/COUNTS.txt", retention-days: 1}
      - name: Upload MM2B artifact
        uses: actions/upload-artifact@v4
        with: {name: aqa-mm2b-corpus, path: "out/MM2B\nout/FAILURES.txt\nout/COUNTS.txt", retention-days: 1}
      - name: Upload MS1B artifact
        uses: actions/upload-artifact@v4
        with: {name: aqa-ms1b-corpus, path: "out/MS1B\nout/FAILURES.txt\nout/COUNTS.txt", retention-days: 1}
      - name: Upload MS2B artifact
        uses: actions/upload-artifact@v4
        with: {name: aqa-ms2b-corpus, path: "out/MS2B\nout/FAILURES.txt\nout/COUNTS.txt", retention-days: 1}
