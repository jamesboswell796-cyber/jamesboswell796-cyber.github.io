name: AQA corpus fetch test

on:
  push:
    branches: [aqa-corpus-fetch-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download June 2015 repair papers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2 'https://mmerevise.co.uk/app/uploads/2020/01/AQA-MPC1-P-QP-JUN15.pdf' -o out/AQA-MPC1-QP-JUN15.pdf
          curl -fL --retry 3 --retry-delay 2 'https://mmerevise.co.uk/wp-content/uploads/2020/01/AQA-MPC2-P-QP-JUN15.pdf' -o out/AQA-MPC2-QP-JUN15.pdf
          test "$(head -c 4 out/AQA-MPC1-QP-JUN15.pdf)" = '%PDF'
          test "$(head -c 4 out/AQA-MPC2-QP-JUN15.pdf)" = '%PDF'
          sha256sum out/*.pdf > out/SHA256SUMS.txt
      - name: Upload repair artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqa-jun15-repair
          path: out
          if-no-files-found: error
          retention-days: 1
